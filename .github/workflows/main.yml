name: Alokmoy Signed Release Builder

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: Flutter GitHub Repo URL (the .git URL, NOT a /tree/ link)
        required: true
        default: https://github.com/Noakhali135/alokmoy-app.git
        type: string
      branch:
        description: Branch
        required: true
        default: arena/a34456a5-alokmoy-app
        type: string

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Pull Flutter repository
        shell: bash
        env:
          TARGET_PAT: ${{ secrets.TARGET_PAT }}
          REPO_URL: ${{ inputs.repo_url }}
          TARGET_BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail

          # Accept only a plain HTTPS repo URL. Catch the common mistake of
          # pasting a /tree/<sha>/<folder> browser link, which git cannot clone.
          case "$REPO_URL" in
            https://github.com/*) ;;
            *) echo "Use an HTTPS github.com repository URL"; exit 1 ;;
          esac

          case "$REPO_URL" in
            */tree/*|*/blob/*|*/commit*|*/mobile*|*\ *|*%20*)
              echo "::error title=Bad repo URL::'$REPO_URL' is a browser link, not a repository URL."
              echo "Use https://github.com/<owner>/<repo>.git and put the branch in the 'branch' input."
              exit 1
              ;;
          esac

          case "$REPO_URL" in
            *.git) ;;
            *)
              [[ "$REPO_URL" == */ ]] && REPO_URL="${REPO_URL%/}"
              REPO_URL="${REPO_URL}.git"
              ;;
          esac

          if [ -n "$TARGET_PAT" ]; then
            AUTH=$(printf 'x-access-token:%s' "$TARGET_PAT" | base64 -w 0)
            echo "::add-mask::$AUTH"

            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
              clone --depth 1 --branch "$TARGET_BRANCH" \
              -- "$REPO_URL" app
          else
            git clone --depth 1 --branch "$TARGET_BRANCH" \
              -- "$REPO_URL" app
          fi

      - name: Locate the Flutter project
        shell: bash
        run: |
          set -euo pipefail

          # The Flutter project lives in Mobile app/ on the current branch.
          # Fail here with a clear message instead of a confusing
          # "No pubspec.yaml file found" from flutter.
          if [ ! -f "app/Mobile app/pubspec.yaml" ]; then
            echo "::error title=No Flutter project::Branch '${{ inputs.branch }}' has no 'Mobile app/pubspec.yaml'."
            echo "Top level of the cloned branch:"
            ls -a app
            echo "This branch predates the Mobile app/ + Backend/ restructure, or has a different layout."
            exit 1
          fi

          echo "Flutter project: app/Mobile app"
          grep -E '^name:|^version:' "app/Mobile app/pubspec.yaml"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore permanent release signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_BASE64" || {
            echo "Missing ANDROID_KEYSTORE_BASE64 secret"
            exit 1
          }

          test -n "$KEYSTORE_PASSWORD" || {
            echo "Missing ANDROID_KEYSTORE_PASSWORD secret"
            exit 1
          }

          # Unchanged by the restructure: key.properties belongs to the android/
          # project (rootProject.file("key.properties")) and the keystore path is
          # resolved relative to android/app/.
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode \
            > app/Mobile\ app/android/app/alokmoy-release.jks

          {
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=alokmoy\n'
            printf 'storeFile=alokmoy-release.jks\n'
          } > "app/Mobile app/android/key.properties"

          chmod 600 \
            "app/Mobile app/android/key.properties" \
            "app/Mobile app/android/app/alokmoy-release.jks"

          keytool -list -v \
            -keystore "app/Mobile app/android/app/alokmoy-release.jks" \
            -storepass:env KEYSTORE_PASSWORD \
            -alias alokmoy \
            | grep -E 'SHA1:|SHA256:'

      - name: Build signed ARM64 release APK
        working-directory: app/Mobile app
        shell: bash
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
        run: |
          set -euo pipefail

          test -n "$GOOGLE_WEB_CLIENT_ID" || {
            echo "Missing GOOGLE_WEB_CLIENT_ID repository variable"
            exit 1
          }

          flutter pub get

          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --dart-define=API_BASE_URL=https://modest-lime-jackal.165-101-188-2.cpanel.site \
            --dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID"

      - name: Remove private signing files
        if: always()
        shell: bash
        run: |
          rm -f \
            "app/Mobile app/android/key.properties" \
            "app/Mobile app/android/app/alokmoy-release.jks"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alokmoy-signed-release-apk
          path: app/Mobile app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 5
